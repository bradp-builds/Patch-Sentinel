name: Patch Sentinel

on:
  schedule:
    - cron: '0 8/12 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install PyYAML
      - name: Run Patch Sentinel
        run: python patch_sentinel.py
        env:
          PATCH_SENTINEL_PROVIDER: ${{ vars.PATCH_SENTINEL_PROVIDER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_MODE: ${{ vars.TEST_MODE }}
          MIN_SEVERITY_SCORE: ${{ vars.MIN_SEVERITY_SCORE }}
          MONITORED_SOURCES: ${{ vars.MONITORED_SOURCES }}
          LAST_SUCCESS_DATE: ${{ vars.LAST_SUCCESS_DATE }}
      - name: Update last success date
        if: success()
        run: gh variable set LAST_SUCCESS_DATE --repo ${{ github.repository }} --body $(date -u +%Y-%m-%d)
        env:
          GH_TOKEN: ${{ github.token }}

  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
