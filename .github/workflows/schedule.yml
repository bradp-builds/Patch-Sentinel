name: Patch Sentinel

on:
  schedule:
    - cron: '0 8/12 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install PyYAML
      - name: Check last run date
        id: check
        run: |
          if [ -f last_run.txt ] && [ "$(cat last_run.txt)" = "$(date +%Y-%m-%d)" ]; then
            echo "⏭️ Already ran today, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Patch Sentinel
        if: steps.check.outputs.skip != 'true'
        run: python patch_sentinel.py
        env:
          PATCH_SENTINEL_PROVIDER: ${{ vars.PATCH_SENTINEL_PROVIDER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_MODE: ${{ vars.TEST_MODE }}
          MIN_SEVERITY_SCORE: ${{ vars.MIN_SEVERITY_SCORE }}
          MONITORED_SOURCES: ${{ vars.MONITORED_SOURCES }}
      - name: Update and commit last run date
        if: success() && steps.check.outputs.skip != 'true'
        run: |
          date +%Y-%m-%d > last_run.txt
          git config user.name "patch-sentinel[bot]"
          git config user.email "patch-sentinel[bot]@users.noreply.github.com"
          git add last_run.txt
          git diff --staged --quiet || git commit -m "Update last run date"
          git push
