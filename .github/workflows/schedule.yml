name: Patch Sentinel

on:
  schedule:
    - cron: '0 */12 * * *' # Every 12 hours
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache & Restore SQLite State Database
        uses: actions/cache@v6
        with:
          path: local_db.sqlite
          key: patch-sentinel-db-${{ github.run_id }}
          restore-keys: |
            patch-sentinel-db-

      - name: Run Patch Sentinel
        run: python patch_sentinel.py
        env:
          PATCH_SENTINEL_PROVIDER: ${{ vars.PATCH_SENTINEL_PROVIDER || 'discord' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIN_SEVERITY_SCORE: ${{ vars.MIN_SEVERITY_SCORE }}
          MONITORED_SOURCES: ${{ vars.MONITORED_SOURCES }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          TEST_MODE: ${{ vars.TEST_MODE }}

