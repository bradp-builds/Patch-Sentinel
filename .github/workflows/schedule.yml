name: Patch Sentinel

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:

concurrency:
  group: patch-sentinel-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Restore SQLite state
        id: state
        uses: actions/cache/restore@v6
        with:
          path: local_db.sqlite
          key: patch-sentinel-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            patch-sentinel-db-

      - name: Run Patch Sentinel
        run: python patch_sentinel.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIN_SEVERITY_SCORE: ${{ vars.MIN_SEVERITY_SCORE }}
          MONITORED_SOURCES: ${{ vars.MONITORED_SOURCES }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          TEST_MODE: ${{ vars.TEST_MODE }}

      - name: Save SQLite state even after a partial failure
        if: ${{ always() && steps.state.outcome == 'success' && hashFiles('local_db.sqlite') != '' && vars.TEST_MODE != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: local_db.sqlite
          key: patch-sentinel-db-${{ github.run_id }}-${{ github.run_attempt }}
