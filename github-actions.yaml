name: Patch Sentinel

on:
  schedule:
    - cron: '0 8/12 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install PyYAML
      - name: Run Patch Sentinel
        run: python patch_sentinel.py
        env:
          PATCH_SENTINEL_PROVIDER: ${{ vars.PATCH_SENTINEL_PROVIDER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_MODE: ${{ vars.TEST_MODE }}
          MIN_SEVERITY_SCORE: ${{ vars.MIN_SEVERITY_SCORE }}
          MONITORED_SOURCES: ${{ vars.MONITORED_SOURCES }}
      - name: Commit last run date
        if: success()
        run: |
          git config user.name "patch-sentinel[bot]"
          git config user.email "patch-sentinel[bot]@users.noreply.github.com"
          git add last_run.txt
          git diff --staged --quiet || git commit -m "Update last run date"
          git push

  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
