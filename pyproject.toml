[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-sentinel"
version = "1.0.0"
description = "A small, stateful CVE monitor with Discord alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6,<7"]

[project.scripts]
patch-sentinel = "patch_sentinel:main"

[tool.setuptools]
py-modules = ["patch_sentinel"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["patch_sentinel.py"]
strict = true
